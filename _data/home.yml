research:
  kicker: "Chapter I · Research"
  title: "Research at the intersection of vision, quality, and generation."
  intro: "My work develops capable and efficient visual systems, with an emphasis on understanding how images are restored, evaluated, and generated."
  items:
    - index: "I.1"
      title: "Image Restoration & Enhancement"
      description: "Designing general and efficient models that recover faithful, high-quality images from real-world degradation, from lightweight super-resolution to large-scale restoration."
    - index: "I.2"
      title: "Vision-Language Quality Assessment"
      description: "Moving beyond scalar scores toward descriptive, comparative, and human-aligned reasoning about visual quality with multimodal language models."
    - index: "I.3"
      title: "Controllable Generative Models"
      description: "Building efficient control mechanisms for large diffusion models while studying the information flow that makes precise visual generation possible."

